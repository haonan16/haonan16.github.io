 $('preferences').addEventListener('submit',e=>e.preventDefault());$('preferences').addEventListener('input',()=>{s.name=$('name').value;for(const k of ['dates','cap','style','driver'])s[k]=$('preferences').elements[k].value;update();});
 $('copyReply').addEventListener('click',()=>copy($('summary').value));$('copyInvite').addEventListener('click',()=>copy(t().inviteText+'\n'+(/^https?:$/.test(location.protocol)?t().link+location.href:t().attachment)));
 $('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob(['\ufeff'+$('summary').value],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='grand-canyon-my-reply.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent=t().downloaded;});
 $('print').addEventListener('click',()=>window.print());$('reset').addEventListener('click',()=>{s={lang:s.lang,origin:'bos',people:'4',name:'',dates:'1',cap:'1',style:'1',driver:'2',fee:false,buffer:false,low:350,high:650};save();render();});update(false);
}
function update(persist=true){const d=t(),n=Number(s.people),rooms=Math.ceil(n/2),car=n===6?1.35:n===5?1.15:1;
 const items=[[d.costs[0],s.low,s.high],[d.costs[1],rooms*360/n,rooms*640/n],[d.costs[2],480*car/n,800*car/n],[d.costs[3],160,250],[d.costs[4],30,100]];if(s.fee)items.push([d.costs[5],100,100]);let lo=items.reduce((a,v)=>a+v[1],0),hi=items.reduce((a,v)=>a+v[2],0);if(s.buffer){items.push([d.costs[6],lo*.1,hi*.1]);lo*=1.1;hi*=1.1;}range=fmt(lo)+'–'+fmt(hi);$('total').textContent=range;$('assumption').textContent=d.assumption.replace('{n}',n).replace('{rooms}',rooms);$('costs').innerHTML=items.map(([label,a,b])=>`<tr><td>${label}</td><td>${fmt(a)}–${fmt(b)}</td></tr>`).join('');
 const labels=d.replyLabels,opts=[d.origins[originCodes.indexOf(s.origin)],'2026 · '+d.dates[Number(s.dates)],d.caps[Number(s.cap)],d.styles[Number(s.style)],d.drivers[Number(s.driver)],range+' / '+(s.lang==='zh'?'人':'person')];
 $('summary').value=d.replyHead+'\n'+(s.name.trim()||d.unnamed)+'\n\n'+labels.map((label,i)=>label+': '+opts[i]).join('\n')+'\n'+(s.fee?(s.lang==='zh'?'含我的 $100 附加费预留。':'Includes my $100 surcharge allowance.'):(s.lang==='zh'?'不含可能适用的非居民附加费。':'Excludes any applicable nonresident surcharge.'))+(s.buffer?(s.lang==='zh'?' 含 10% 机动预算。':' Includes a 10% contingency.'):'')+'\n'+d.estimateNote+'\n\n'+d.replyTail;
 if(persist)save();$('saveState').textContent=storageOK?d.saved:d.unsaved;
}
async function copy(text){try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);$('status').textContent=t().copied;}catch(e){const box=$('summary'),old=box.value;box.value=text;box.focus();box.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}if(ok){box.value=old;$('status').textContent=t().copied;}else{$('status').textContent=t().manual;box.addEventListener('blur',()=>update(false),{once:true});}}}
render();
</script></body></html>
