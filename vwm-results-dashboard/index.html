<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAG CoRL Results Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #64748b;
      --line: #d7dde7;
      --accent: #0f766e;
      --blue: #2563eb;
      --amber: #b45309;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 4;
    }
    h1 { font-size: 21px; margin: 0 0 10px; letter-spacing: 0; }
    .controls {
      display: grid;
      grid-template-columns: 1.6fr repeat(4, minmax(130px, 1fr));
      gap: 10px;
      align-items: end;
    }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
    input, select {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: white;
      color: var(--ink);
      min-width: 0;
    }
    main { padding: 18px 24px 42px; display: grid; gap: 18px; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .section-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    h2 { font-size: 15px; margin: 0; letter-spacing: 0; }
    .count { color: var(--muted); font-size: 12px; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      padding: 14px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-width: 0;
      background: #fbfcfe;
    }
    .stat-value { font-size: 22px; font-weight: 720; }
    .stat-label { color: var(--muted); font-size: 12px; }
    .latest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      padding: 14px;
    }
    .result-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: white;
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .card-title { font-weight: 700; overflow-wrap: anywhere; }
    .card-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      border: 1px solid #dbe4ef;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 12px;
      color: #334155;
      background: #f8fafc;
    }
    .tag.hot { border-color: #b7d7d2; background: #ecfdf5; color: #115e59; }
    .tag.warn { border-color: #f2d49b; background: #fff7ed; color: #92400e; }
    .table-wrap { overflow: auto; max-height: 460px; }
    table { border-collapse: collapse; width: 100%; min-width: 1050px; }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid #edf0f5;
      vertical-align: top;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      z-index: 1;
      color: #334155;
      font-weight: 650;
    }
    tr.metric-row { cursor: pointer; }
    tr.metric-row:hover { background: #f2f7f6; }
    .metric-chip {
      display: inline-block;
      margin: 0 5px 5px 0;
      padding: 2px 7px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 12px;
    }
    .path-link { color: var(--blue); text-decoration: none; overflow-wrap: anywhere; white-space: normal; }
    .path-link:hover { text-decoration: underline; }
    .plot-list { display: grid; gap: 8px; padding: 14px; }
    .plot-row { display: grid; grid-template-columns: minmax(210px, 280px) 1fr 80px; gap: 10px; align-items: center; }
    .bar-track { height: 12px; border-radius: 999px; background: #e8edf5; overflow: hidden; }
    .bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--blue)); }
    .follow-list { display: grid; gap: 8px; padding: 14px; }
    .follow-row { border-left: 3px solid var(--amber); padding: 8px 10px; background: #fffaf2; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
      padding: 14px;
    }
    .video-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: white;
      min-width: 0;
    }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #0f172a;
    }
    .video-meta { padding: 9px 10px 11px; display: grid; gap: 4px; }
    .video-title { font-weight: 650; overflow-wrap: anywhere; }
    .video-sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .missing { color: var(--bad); font-weight: 650; }
    .empty { padding: 18px; color: var(--muted); }
    @media (max-width: 900px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .plot-row { grid-template-columns: 1fr; }
      main, header { padding-left: 14px; padding-right: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>VAG CoRL Results Dashboard</h1>
    <div class="controls">
      <label>Search<input id="search" placeholder="benchmark, method, task, path"></label>
      <label>Benchmark<select id="benchmark"><option value="">All benchmarks</option></select></label>
      <label>Study Type<select id="study"><option value="">All studies</option></select></label>
      <label>Method<select id="model"><option value="">All methods</option></select></label>
      <label>Task Suite<select id="suite"><option value="">All suites</option></select></label>
    </div>
  </header>
  <main>
    <section>
      <div class="section-head">
        <h2>Summary</h2>
        <div class="count" id="generated"></div>
      </div>
      <div class="summary-grid" id="summary"></div>
    </section>
    <section>
      <div class="section-head">
        <h2>Latest Results</h2>
        <div class="count" id="latest-count"></div>
      </div>
      <div class="latest-grid" id="latest"></div>
    </section>
    <section>
      <div class="section-head">
        <h2>Key Metric Plot</h2>
        <div class="count" id="plot-count"></div>
      </div>
      <div class="plot-list" id="plots"></div>
    </section>
    <section>
      <div class="section-head">
        <h2>Experiment Index</h2>
        <div class="count" id="experiment-count"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Benchmark</th><th>Task Suite</th><th>Task</th><th>Method</th><th>Study Type</th><th>Date</th><th>Key Metrics</th><th>Raw</th></tr></thead>
          <tbody id="experiments"></tbody>
        </table>
      </div>
    </section>
    <section>
      <div class="section-head">
        <h2>Ablations And Comparisons</h2>
        <div class="count" id="comparison-count"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Benchmark</th><th>Method</th><th>Study Type</th><th>Date</th><th>Key Metrics</th><th>Raw</th></tr></thead>
          <tbody id="comparisons"></tbody>
        </table>
      </div>
    </section>
    <section>
      <div class="section-head">
        <h2>Follow-up</h2>
        <div class="count" id="follow-count"></div>
      </div>
      <div class="follow-list" id="followup"></div>
    </section>
    <section>
      <div class="section-head">
        <h2>Qualitative Videos</h2>
        <div class="count" id="video-count"></div>
      </div>
      <div class="video-grid" id="videos"></div>
    </section>
  </main>
  <script>
    const state = { data: null };
    const els = {
      search: document.getElementById('search'),
      benchmark: document.getElementById('benchmark'),
      study: document.getElementById('study'),
      model: document.getElementById('model'),
      suite: document.getElementById('suite'),
      generated: document.getElementById('generated'),
      summary: document.getElementById('summary'),
      latest: document.getElementById('latest'),
      latestCount: document.getElementById('latest-count'),
      plots: document.getElementById('plots'),
      plotCount: document.getElementById('plot-count'),
      experiments: document.getElementById('experiments'),
      comparisons: document.getElementById('comparisons'),
      followup: document.getElementById('followup'),
      videos: document.getElementById('videos'),
      experimentCount: document.getElementById('experiment-count'),
      comparisonCount: document.getElementById('comparison-count'),
      followCount: document.getElementById('follow-count'),
      videoCount: document.getElementById('video-count'),
    };

    function textIncludes(row, query) {
      if (!query) return true;
      return JSON.stringify(row).toLowerCase().includes(query);
    }
    function unique(values) {
      return [...new Set(values.filter(Boolean))].sort();
    }
    function fillSelect(select, values) {
      for (const value of values) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      }
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[ch]));
    }
    function fmt(value) {
      if (Number.isFinite(value)) {
        const abs = Math.abs(value);
        if (abs >= 100) return Number(value).toFixed(1);
        if (abs >= 10) return Number(value).toFixed(2);
        return Number(value).toFixed(4);
      }
      return value ?? '';
    }
    function metricLabel(metrics) {
      const keys = Object.keys(metrics || {}).slice(0, 8);
      return keys.map(k => {
        const v = metrics[k];
        const shown = fmt(v);
        return `<span class="metric-chip">${escapeHtml(k)}: ${escapeHtml(shown)}</span>`;
      }).join('') || '<span class="count">No numeric metrics found</span>';
    }
    function rawLink(row) {
      if (!row.raw_url) return escapeHtml(row.relative_path || row.path || '');
      return `<a class="path-link" target="_blank" href="${escapeHtml(row.raw_url)}">${escapeHtml(row.relative_path || row.path || row.raw_url)}</a>`;
    }
    function filters() {
      return {
        q: els.search.value.trim().toLowerCase(),
        benchmark: els.benchmark.value,
        study: els.study.value,
        model: els.model.value,
        suite: els.suite.value,
      };
    }
    function filterExperiments(rows) {
      const f = filters();
      return rows.filter(row =>
        textIncludes(row, f.q) &&
        (!f.model || row.model === f.model) &&
        (!f.benchmark || row.benchmark === f.benchmark) &&
        (!f.study || row.study_type === f.study) &&
        (!f.suite || row.task_suite === f.suite)
      );
    }
    function renderSummary() {
      const summary = state.data.summary || {};
      const stats = [
        ['Experiments', summary.experiments || 0],
        ['Benchmarks', summary.benchmarks || 0],
        ['Study types', summary.study_types || 0],
        ['Latest groups', summary.latest_groups || 0],
        ['Videos', summary.videos || 0],
      ];
      els.generated.textContent = `Generated ${escapeHtml(state.data.generated_at || '')}`;
      els.summary.innerHTML = stats.map(([label, value]) => `
        <div class="stat"><div class="stat-value">${escapeHtml(value)}</div><div class="stat-label">${escapeHtml(label)}</div></div>
      `).join('');
    }
    function renderLatest() {
      const rows = filterExperiments(state.data.latest || []).slice(0, 18);
      els.latestCount.textContent = `${rows.length} shown`;
      els.latest.innerHTML = rows.map(row => `
        <article class="result-card">
          <div class="card-title">${escapeHtml(row.benchmark)} · ${escapeHtml(row.method)}</div>
          <div class="card-meta">${escapeHtml(row.task_suite)} · ${escapeHtml(row.run_date || row.file_mtime || '')}</div>
          <div class="tags">
            <span class="tag hot">${escapeHtml(row.study_type)}</span>
            <span class="tag">${escapeHtml(row.result_kind)}</span>
            ${row.is_latest_for_group ? '<span class="tag hot">latest</span>' : ''}
          </div>
          <div>${metricLabel(row.key_metrics || {})}</div>
          <div>${rawLink(row)}</div>
        </article>
      `).join('') || '<div class="empty">No latest results match the filters.</div>';
    }
    function experimentRow(row) {
      return `
        <tr>
          <td>${escapeHtml(row.benchmark)}</td>
          <td>${escapeHtml(row.task_suite)}</td>
          <td>${escapeHtml(row.task)}</td>
          <td>${escapeHtml(row.method)}</td>
          <td>${escapeHtml(row.study_type)}</td>
          <td>${escapeHtml(row.run_date || row.file_mtime || '')}</td>
          <td>${metricLabel(row.key_metrics || {})}</td>
          <td>${rawLink(row)}</td>
        </tr>
      `;
    }
    function renderExperiments() {
      const rows = filterExperiments(state.data.experiments || []);
      els.experimentCount.textContent = `${rows.length} / ${(state.data.experiments || []).length} artifacts`;
      els.experiments.innerHTML = rows.slice(0, 500).map(experimentRow).join('') || '<tr><td colspan="8" class="empty">No matching experiments.</td></tr>';
    }
    function renderComparisons() {
      const rows = filterExperiments(state.data.comparisons || []);
      els.comparisonCount.textContent = `${rows.length} studies`;
      els.comparisons.innerHTML = rows.slice(0, 240).map(row => `
        <tr>
          <td>${escapeHtml(row.benchmark)}</td>
          <td>${escapeHtml(row.method)}</td>
          <td>${escapeHtml(row.study_type)}</td>
          <td>${escapeHtml(row.run_date || row.file_mtime || '')}</td>
          <td>${metricLabel(row.key_metrics || {})}</td>
          <td>${rawLink(row)}</td>
        </tr>
      `).join('') || '<tr><td colspan="6" class="empty">No matching comparisons.</td></tr>';
    }
    function renderPlots() {
      const candidates = filterExperiments(state.data.latest || [])
        .map(row => {
          const metrics = row.key_metrics || {};
          const order = ['DirAcc', 'Success', 'AUROC', 'LPIPS', 'PSNR', 'SSIM'];
          const key = order.find(name => Number.isFinite(metrics[name]));
          return key ? { row, key, value: Number(metrics[key]) } : null;
        })
        .filter(Boolean)
        .slice(0, 16);
      els.plotCount.textContent = `${candidates.length} bars`;
      if (!candidates.length) {
        els.plots.innerHTML = '<div class="empty">No plottable key metrics match the filters.</div>';
        return;
      }
      const maxValue = Math.max(...candidates.map(item => item.value), 1);
      els.plots.innerHTML = candidates.map(item => {
        const width = Math.max(2, Math.min(100, 100 * item.value / maxValue));
        const label = `${item.row.benchmark} · ${item.row.method} · ${item.key}`;
        return `
          <div class="plot-row">
            <div class="card-meta">${escapeHtml(label)}</div>
            <div class="bar-track"><div class="bar" style="width:${width}%"></div></div>
            <div>${escapeHtml(fmt(item.value))}</div>
          </div>
        `;
      }).join('');
    }
    function renderFollowup() {
      const rows = filterExperiments(state.data.experiments || [])
        .filter(row => row.parse_error || !Object.keys(row.key_metrics || {}).length || row.study_type === 'smoke')
        .slice(0, 80);
      els.followCount.textContent = `${rows.length} rows`;
      els.followup.innerHTML = rows.map(row => {
        const reason = row.parse_error ? `parse error: ${row.parse_error}` : (!Object.keys(row.key_metrics || {}).length ? 'no extracted key metrics' : 'smoke result, confirm if follow-up eval is needed');
        return `<div class="follow-row"><strong>${escapeHtml(row.benchmark)} · ${escapeHtml(row.method)}</strong><div class="card-meta">${escapeHtml(reason)} · ${rawLink(row)}</div></div>`;
      }).join('') || '<div class="empty">No parser errors, metric gaps, or smoke-only rows match the filters.</div>';
    }
    function renderVideos() {
      const f = filters();
      const rows = state.data.videos.filter(row =>
        textIncludes(row, f.q) &&
        (!f.model || row.model === f.model || row.model === 'comparison')
      ).slice(0, 240);
      els.videoCount.textContent = `${rows.length} shown / ${state.data.videos.length} videos`;
      els.videos.innerHTML = rows.map(row => `
        <article class="video-card">
          ${row.exists ? `<video controls preload="metadata" src="${escapeHtml(row.url)}"></video>` : `<div class="empty missing">Missing file</div>`}
          <div class="video-meta">
            <div class="video-title">${escapeHtml(row.model || row.kind)} ${escapeHtml(row.direction)}</div>
            <div class="video-sub">${escapeHtml(row.episode || 'unknown episode')}</div>
            <div class="video-sub">${escapeHtml(row.kind)} · ${escapeHtml(row.source_manifest)}</div>
            <div class="video-sub">${escapeHtml(row.url)}</div>
          </div>
        </article>
      `).join('') || '<div class="empty">No matching videos.</div>';
    }
    function render() {
      renderSummary();
      renderLatest();
      renderPlots();
      renderExperiments();
      renderComparisons();
      renderFollowup();
      renderVideos();
    }
    fetch('data/dashboard_data.json').catch(() => fetch('data/results.json'))
      .then(r => r.json())
      .then(data => {
        state.data = data;
        fillSelect(els.benchmark, unique((data.experiments || []).map(r => r.benchmark)));
        fillSelect(els.study, unique((data.experiments || []).map(r => r.study_type)));
        fillSelect(els.model, unique([
          ...(data.experiments || []).map(r => r.method),
          ...(data.videos || []).map(r => r.model).filter(m => m !== 'comparison')
        ]));
        fillSelect(els.suite, unique((data.experiments || []).map(r => r.task_suite)));
        for (const el of Object.values(els)) {
          if (el && (el.tagName === 'INPUT' || el.tagName === 'SELECT')) el.addEventListener('input', render);
        }
        render();
      })
      .catch(err => {
        els.videos.innerHTML = `<div class="empty missing">Failed to load dashboard data: ${escapeHtml(err)}</div>`;
      });
  </script>
</body>
</html>
